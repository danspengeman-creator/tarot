<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threshold — A Tarot Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171022;
    --dusk:#241a35;
    --midnight:#140e1f;
    --parchment:#f3ead9;
    --gold:#b9924a;
    --gold-bright:#e0b968;
    --ember:#8a3b2f;
    --line: rgba(233,214,177,0.18);
    --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
    --display: 'Cinzel Decorative', 'Iowan Old Style', Georgia, serif;
    --display-small: 'Cinzel', 'Iowan Old Style', Georgia, serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at 20% -10%, #2c2043 0%, transparent 55%),
      radial-gradient(ellipse at 85% 10%, #201a38 0%, transparent 50%),
      var(--midnight);
    color:var(--parchment);
    font-family:var(--serif);
  }

  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 60% 8%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 30% 45%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 92% 60%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 45% 80%, rgba(255,255,255,.25), transparent),
      radial-gradient(1px 1px at 15% 90%, rgba(255,255,255,.3), transparent);
    opacity:.6;
  }

  .wrap{
    position:relative; z-index:1;
    max-width:920px;
    margin:0 auto;
    padding: clamp(32px, 8vw, 56px) 20px clamp(60px, 12vw, 100px);
  }

  header{
    text-align:center;
    margin-bottom:clamp(32px, 7vw, 48px);
  }

  .mark{
    width:34px; height:34px;
    margin:0 auto 18px;
    opacity:.85;
  }

  h1{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(2rem, 8vw, 3.1rem);
    letter-spacing:.01em;
    margin:0 0 10px;
    color:var(--parchment);
  }

  .sub{
    color:#c9b9dd;
    font-size:clamp(1.05rem, 3.4vw, 1.2rem);
    max-width:42ch;
    margin:0 auto;
    line-height:1.6;
    font-style:italic;
    padding:0 8px;
  }

  /* ---- intention ---- */
  .intention{
    max-width:520px;
    margin:36px auto 0;
    text-align:center;
    padding:0 8px;
  }
  .intention label{
    display:block;
    font-size:.82rem;
    letter-spacing:.04em;
    color:#a996c4;
    margin-bottom:10px;
    line-height:1.4;
  }
  .intention input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--parchment);
    font-family:var(--serif);
    font-size:16px; /* prevents iOS auto-zoom on focus */
    font-style:italic;
    text-align:center;
    padding:8px 4px 12px;
    outline:none;
  }
  .intention input::placeholder{color:#7c6c93;}
  .intention input:focus{border-bottom-color:var(--gold);}

  /* ---- spread choice ---- */
  .spreads{
    display:flex;
    justify-content:center;
    gap:clamp(6px, 2.5vw, 12px);
    flex-wrap:nowrap;
    margin:32px 0 8px;
    width:100%;
  }
  .spread-btn{
    background:transparent;
    border:1px solid var(--line);
    color:#d8cbe8;
    font-family:var(--display-small);
    font-size:clamp(.62rem, 3.1vw, .88rem);
    letter-spacing:.01em;
    padding:clamp(9px, 2.6vw, 12px) clamp(8px, 3vw, 18px);
    min-height:44px;
    flex:1 1 0;
    min-width:0;
    max-width:200px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    border-radius:2px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease, background .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .spread-btn:hover{border-color:var(--gold); color:var(--gold-bright);}
  .spread-btn.active{
    border-color:var(--gold);
    color:var(--midnight);
    background:var(--gold-bright);
  }
  .spread-desc{
    text-align:center;
    color:#9c8bb8;
    font-size:.88rem;
    font-style:italic;
    min-height:1.4em;
    margin-bottom:8px;
    padding:0 12px;
  }

  .draw-row{
    display:flex;
    justify-content:center;
    margin:24px 0 8px;
  }
  .draw-btn{
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:var(--midnight);
    border:none;
    padding:15px 40px;
    min-height:48px;
    font-family:var(--display-small);
    font-size:1rem;
    letter-spacing:.04em;
    border-radius:2px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(185,146,74,.18);
    transition:transform .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .draw-btn:hover{transform:translateY(-1px); box-shadow:0 10px 28px rgba(185,146,74,.28);}
  .draw-btn:active{transform:translateY(0);}
  .draw-btn:disabled{opacity:.45; cursor:default; transform:none; box-shadow:none;}

  .reversed-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:18px;
    font-size:.85rem;
    color:#a996c4;
  }
  .reversed-toggle input{
    accent-color:var(--gold);
    width:16px; height:16px;
  }

  /* ---- reading area ---- */
  .reading{
    margin-top:clamp(40px, 8vw, 56px);
  }

  .cards{
    display:grid;
    gap:clamp(20px, 5vw, 34px);
    justify-content:center;
  }
  .cards.n1{grid-template-columns: minmax(0,240px); max-width:240px; margin:0 auto;}
  .cards.n3{grid-template-columns: repeat(3, minmax(0,220px));}
  .cards.n10{grid-template-columns: repeat(5, minmax(0,160px)); row-gap:44px;}

  @media (max-width:720px){
    .cards.n10{grid-template-columns: repeat(3, minmax(0,150px));}
  }
  @media (max-width:520px){
    .cards.n3{grid-template-columns: minmax(0,1fr); max-width:240px; margin:0 auto;}
    .cards.n10{grid-template-columns: repeat(2, minmax(0,150px)); max-width:340px; margin:0 auto;}
  }

  .slot{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .position-label{
    font-size:.76rem;
    letter-spacing:.04em;
    color:var(--gold);
    margin-bottom:12px;
    font-style:italic;
    min-height:1.2em;
    line-height:1.3;
    padding:0 4px;
  }

  .card-scene{
    perspective:1400px;
    width:100%;
    aspect-ratio: 5 / 8.2;
    -webkit-tap-highlight-color:transparent;
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform 0.9s cubic-bezier(.2,.7,.3,1);
    cursor:pointer;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.45));
  }
  .card.flipped{transform:rotateY(180deg);}

  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:6px;
    overflow:hidden;
  }

  .back{
    background:
      repeating-linear-gradient(45deg, rgba(233,214,177,.05) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, #2b2044, #1a1428);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .back::before{
    content:"";
    width:62%;
    height:62%;
    border:1px solid rgba(224,185,104,.55);
    border-radius:50%;
    background:
      radial-gradient(circle, transparent 55%, rgba(224,185,104,.08) 56%),
      conic-gradient(from 0deg, rgba(224,185,104,.12), transparent 25%, rgba(224,185,104,.12) 50%, transparent 75%, rgba(224,185,104,.12));
  }

  .front{
    transform:rotateY(180deg);
    background:linear-gradient(180deg, #f6efdf, var(--parchment));
    border:1px solid var(--gold);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0;
    color:var(--ink);
  }
  .front .card-image{
    flex:1;
    width:100%;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#0f0a18;
  }
  .front .card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    /* Reversed orientation is applied ONLY to the artwork, isolated from
       the 3D flip transform on .card, so it renders correctly every time
       rather than depending on how the two transforms combine. */
    transform:none;
    transition:none;
  }
  .front .card-image img.reversed-art{
    transform:rotate(180deg);
  }
  .front .glyph{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }
  .front .glyph.reversed-art{
    transform:rotate(180deg);
  }
  .front .glyph svg{width:60%; height:auto; max-height:100%;}
  .front .caption{
    width:100%;
    padding:7% 6% 9%;
    text-align:center;
  }
  .front .arcana-no{
    font-size:.66rem;
    letter-spacing:.08em;
    color:var(--ember);
  }
  .front .card-name{
    font-family:var(--display-small);
    font-size:clamp(.72rem, 2.4vw, .82rem);
    letter-spacing:.02em;
    line-height:1.3;
    margin-top:4px;
  }
  .front .suit-tag{
    font-size:.6rem;
    letter-spacing:.06em;
    color:#8a6f3f;
    text-transform:uppercase;
    margin-top:2px;
  }

  .meaning{
    margin-top:16px;
    max-width:280px;
    padding:0 4px;
  }
  .meaning .orientation{
    font-size:.7rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  .meaning .keywords{
    font-size:1rem;
    color:#d8cbe8;
    line-height:1.6;
  }

  .reveal-hint{
    text-align:center;
    color:#8a7aa3;
    font-size:.85rem;
    font-style:italic;
    margin-top:40px;
  }

  .synthesis{
    max-width:640px;
    margin:56px auto 0;
    padding:32px 30px;
    border:1px solid var(--line);
    border-radius:4px;
    background:rgba(255,255,255,0.02);
    opacity:0;
    transform:translateY(8px);
    transition:opacity .6s ease, transform .6s ease;
  }
  .synthesis.visible{opacity:1; transform:translateY(0);}
  .synthesis h2{
    font-family:var(--display);
    font-weight:400;
    font-size:1.3rem;
    margin:0 0 6px;
    color:var(--gold-bright);
    text-align:center;
  }
  .synthesis .tone-line{
    text-align:center;
    color:#c9b9dd;
    font-style:italic;
    font-size:.95rem;
    margin-bottom:22px;
  }
  .synthesis .card-note{
    padding:14px 0;
    border-top:1px solid var(--line);
  }
  .synthesis .card-note:first-of-type{border-top:none;}
  .synthesis .card-note .who{
    font-size:.8rem;
    letter-spacing:.03em;
    color:var(--gold);
    margin-bottom:4px;
  }
  .synthesis .card-note .what{
    font-size:1.05rem;
    color:#e6dcf2;
    line-height:1.55;
  }
  .synthesis .caveat{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:.82rem;
    color:#8a7aa3;
    font-style:italic;
    line-height:1.6;
  }

  footer{
    text-align:center;
    margin-top:70px;
    color:#5f527a;
    font-size:.78rem;
  }

  .reset-row{
    text-align:center;
    margin-top:44px;
  }
  .reset-btn{
    background:none;
    border:none;
    color:#9c8bb8;
    font-family:var(--serif);
    font-style:italic;
    font-size:.9rem;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .reset-btn:hover{color:var(--gold-bright);}
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">

  <header>
    <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="12" stroke="#b9924a" stroke-width="1"/>
      <path d="M20 2 L20 8 M20 32 L20 38 M2 20 L8 20 M32 20 L38 20" stroke="#b9924a" stroke-width="1"/>
    </svg>
    <h1>Threshold</h1>
    <p class="sub">A quiet place to draw the cards and sit with what they show you.</p>
  </header>

  <div class="intention">
    <label for="intent">What are you carrying into this reading? <em>(optional)</em></label>
    <input id="intent" type="text" placeholder="e.g. a decision I keep circling back to">
  </div>

  <div class="spreads" id="spreadButtons"></div>
  <p class="spread-desc" id="spreadDesc"></p>

  <div class="draw-row">
    <button class="draw-btn" id="drawBtn">Draw</button>
  </div>
  <div class="reversed-toggle">
    <input type="checkbox" id="allowReversed" checked>
    <label for="allowReversed">Allow reversed cards</label>
  </div>

  <p class="reveal-hint" id="revealHint" style="display:none;">Tap a card to turn it over.</p>

  <div class="reading">
    <div class="cards" id="cardsArea"></div>
  </div>

  <div class="synthesis" id="synthesis"></div>

  <div class="reset-row" id="resetRow" style="display:none;">
    <button class="reset-btn" id="resetBtn">Begin a new reading</button>
  </div>

  <footer>Rider–Waite–Smith imagery, first published 1909, is in the public domain.</footer>
</div>

<script>
/* ---------------- Card images ---------------- */
/* Rider-Waite-Smith deck, public domain (1909), digitized by mixvlad/TarotCards.
   Pinned to a specific commit so filenames never shift under us. */
const IMG_BASE = "https://raw.githubusercontent.com/mixvlad/TarotCards/5c44ca5c94a9d67f9bc06cb6b920c2544fa76c74/tarot/rider-waite/720px/";

/* ---------------- Card data ---------------- */
/* Each entry: [name, filename, upright meaning, upright valence, reversed meaning, reversed valence]
   valence: 1 = uplifting, 0 = neutral/depends on context, -1 = challenging */
const MAJOR = [
  ["The Fool","00_Fool.jpg","New beginnings, a leap of faith, innocence, an open road ahead.",1,"Recklessness, hesitation at the wrong moment, a lesson avoided.",-1],
  ["The Magician","01_Magician.jpg","Focused will, having exactly what you need, turning intention into action.",1,"Scattered energy, manipulation, talent left unused.",-1],
  ["The High Priestess","02_High_Priestess.jpg","Quiet knowing, intuition over explanation, something not yet ready to be said.",0,"Secrets kept too long, disconnection from your own gut sense.",-1],
  ["The Empress","03_Empress.jpg","Abundance, nurturing, creativity coming to fruition.",1,"Overgiving, stalled growth, neglecting yourself while tending others.",-1],
  ["The Emperor","04_Emperor.jpg","Structure, steady authority, building something built to last.",1,"Rigidity, control used as a substitute for trust.",-1],
  ["The Hierophant","05_Hierophant.jpg","Tradition, shared belief, learning from an established path.",0,"Questioning inherited rules, outgrowing an old teacher.",0],
  ["The Lovers","06_Lovers.jpg","A meaningful choice, alignment of values, genuine connection.",1,"Misalignment, a choice made from fear rather than desire.",-1],
  ["The Chariot","07_Chariot.jpg","Willpower, forward motion, holding opposing forces in one direction.",1,"Loss of direction, forcing an outcome instead of steering it.",-1],
  ["Strength","08_Strength.jpg","Quiet courage, patience with what's difficult, gentleness that holds firm.",1,"Self-doubt, forcing control instead of trusting steadiness.",-1],
  ["The Hermit","09_Hermit.jpg","Withdrawal for the sake of clarity, guidance found in solitude.",0,"Isolation past its use, avoiding the very insight you're seeking.",-1],
  ["Wheel of Fortune","10_Wheel_of_Fortune.jpg","A turning point, change arriving on its own timeline, cycles completing.",0,"Resisting a change already underway, feeling at the mercy of events.",-1],
  ["Justice","11_Justice.jpg","Fairness, truth coming to light, consequences meeting their cause.",0,"Imbalance, an unresolved matter, avoiding accountability.",-1],
  ["The Hanged Man","12_Hanged_Man.jpg","A pause that reveals a new perspective, surrender that isn't defeat.",0,"Stalling, martyrdom, delay that has stopped serving you.",-1],
  ["Death","13_Death.jpg","An ending that clears space, transformation, letting a chapter close.",0,"Resistance to necessary change, clinging to what has already ended.",-1],
  ["Temperance","14_Temperance.jpg","Balance, patience, blending opposites into something workable.",1,"Excess, impatience, an imbalance that keeps tipping over.",-1],
  ["The Devil","15_Devil.jpg","Attachment, a pattern that feels bigger than it is, something binding you.",-1,"Recognizing the chain, a first step toward release.",1],
  ["The Tower","16_Tower.jpg","Sudden upheaval, a false structure giving way, necessary disruption.",-1,"Averted crisis, or fear of a collapse that hasn't happened yet.",0],
  ["The Star","17_Star.jpg","Renewed hope, quiet healing, faith after a hard stretch.",1,"Discouragement, disconnection from hope, running low on faith.",-1],
  ["The Moon","18_Moon.jpg","Uncertainty, what's hidden beneath the surface, trusting instinct in the dark.",-1,"Confusion lifting, a fear turning out smaller than it looked.",1],
  ["The Sun","19_Sun.jpg","Clarity, joy, a straightforward and welcome success.",1,"Clouded joy, a delay before the good news lands.",0],
  ["Judgement","20_Judgement.jpg","A reckoning, a calling answered, waking up to what's true.",1,"Self-judgment, hesitation to answer a call you've already heard.",-1],
  ["The World","21_World.jpg","Completion, arrival, a cycle closing with everything in place.",1,"Loose ends, a near-completion still asking for one more step.",0]
];

const SUITS = [
  {name:"Wands", file:"Wands", theme:"action, ambition, creative fire"},
  {name:"Cups", file:"Cups", theme:"emotion, relationship, intuition"},
  {name:"Swords", file:"Swords", theme:"thought, conflict, clarity"},
  {name:"Pentacles", file:"Pents", theme:"resources, work, the material world"}
];

/* [rank name, upright meaning, upright valence, reversed meaning, reversed valence] */
const RANKS = [
  ["Ace","a fresh spark",1,"a false start or delay",-1],
  ["Two","a choice or partnership forming",0,"hesitation between two paths",-1],
  ["Three","early growth, collaboration",1,"misalignment among the parties involved",-1],
  ["Four","stability, a pause to consolidate",0,"stagnation, taking stability for granted",-1],
  ["Five","friction, competition, a setback",-1,"tension easing, conflict resolving",1],
  ["Six","cooperation, a shared win",1,"imbalance in giving and receiving",-1],
  ["Seven","perseverance, assessing your position",0,"overextension, doubting your progress",-1],
  ["Eight","swift movement, momentum",1,"scattered effort, progress stalling",-1],
  ["Nine","near-completion, resilience",0,"exhaustion close to the finish line",-1],
  ["Ten","fulfillment, the full weight of the matter",0,"burden, an ending overdue",-1],
  ["Page","a curious beginner's energy",0,"immaturity, news delayed",-1],
  ["Knight","pursuit, direct action",1,"recklessness or, conversely, stalled momentum",-1],
  ["Queen","mastery expressed with warmth",1,"that same mastery turned inward or withheld",-1],
  ["King","mastery expressed with authority",1,"that authority misapplied or overbearing",-1]
];

function buildDeck(){
  const deck = [];
  MAJOR.forEach((c, i)=>{
    deck.push({
      name:c[0], arcana:"major", number:i,
      image: IMG_BASE + c[1],
      upright:c[2], uprightValence:c[3],
      reversedMeaning:c[4], reversedValence:c[5],
      suit:null
    });
  });
  SUITS.forEach(s=>{
    RANKS.forEach((r,i)=>{
      const rankNum = String(i+1).padStart(2,'0');
      deck.push({
        name:`${r[0]} of ${s.name}`,
        arcana:"minor", suit:s.name, rank:r[0], number:i+1,
        image: IMG_BASE + `${s.file}${rankNum}.jpg`,
        upright:`${r[1][0].toUpperCase()+r[1].slice(1)} — within the realm of ${s.theme}.`,
        uprightValence:r[2],
        reversedMeaning:`${r[3][0].toUpperCase()+r[3].slice(1)} — within the realm of ${s.theme}.`,
        reversedValence:r[4]
      });
    });
  });
  return deck;
}
const DECK = buildDeck();

/* ---------------- Glyphs (simple symbolic marks per suit / major) ---------------- */
function glyphFor(card){
  const stroke = "#8a6f3f";
  if(card.arcana==="major"){
    return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="${stroke}" stroke-width="1.2"/><path d="M50 8 L50 92 M8 50 L92 50" stroke="${stroke}" stroke-width="1"/><circle cx="50" cy="50" r="6" fill="${stroke}"/></svg>`;
  }
  const marks = {
    Wands: `<svg viewBox="0 0 100 100"><line x1="50" y1="10" x2="50" y2="90" stroke="${stroke}" stroke-width="3"/><line x1="35" y1="25" x2="65" y2="25" stroke="${stroke}" stroke-width="2"/><line x1="35" y1="75" x2="65" y2="75" stroke="${stroke}" stroke-width="2"/></svg>`,
    Cups: `<svg viewBox="0 0 100 100"><path d="M30 30 Q30 65 50 65 Q70 65 70 30" fill="none" stroke="${stroke}" stroke-width="3"/><line x1="50" y1="65" x2="50" y2="80" stroke="${stroke}" stroke-width="3"/><line x1="35" y1="80" x2="65" y2="80" stroke="${stroke}" stroke-width="3"/></svg>`,
    Swords: `<svg viewBox="0 0 100 100"><line x1="50" y1="10" x2="50" y2="80" stroke="${stroke}" stroke-width="3"/><path d="M50 10 L42 26 L58 26 Z" fill="${stroke}"/><line x1="32" y1="60" x2="68" y2="60" stroke="${stroke}" stroke-width="3"/></svg>`,
    Pentacles: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="32" fill="none" stroke="${stroke}" stroke-width="2.5"/><path d="M50 25 L58 45 L80 45 L62 58 L69 78 L50 65 L31 78 L38 58 L20 45 L42 45 Z" fill="none" stroke="${stroke}" stroke-width="1.4"/></svg>`
  };
  return marks[card.suit];
}

/* ---------------- Spreads ---------------- */
const SPREADS = {
  single: {label:"Single Card", positions:["Where you are"], desc:"One card, for a clear question or a quiet check-in."},
  three:  {label:"Three Card", positions:["Past","Present","Future"], desc:"A short arc: what led here, where you stand, where it's headed."},
  celtic: {label:"Celtic Cross", positions:["The Heart of It","What Crosses You","Foundation","Recent Past","What Crowns You","Near Future","Your Stance","Outside Influences","Hopes & Fears","Outcome"], desc:"A fuller ten-card look for a situation with real weight to it."}
};

let currentSpread = "three";
let drawnCards = [];

const spreadButtons = document.getElementById('spreadButtons');
Object.keys(SPREADS).forEach(key=>{
  const btn = document.createElement('button');
  btn.className = 'spread-btn' + (key===currentSpread ? ' active':'');
  btn.textContent = SPREADS[key].label;
  btn.dataset.key = key;
  btn.addEventListener('click', ()=>{
    currentSpread = key;
    document.querySelectorAll('.spread-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    updateDesc();
    clearReading();
  });
  spreadButtons.appendChild(btn);
});

function updateDesc(){
  document.getElementById('spreadDesc').textContent = SPREADS[currentSpread].desc;
}
updateDesc();

function shuffledDeck(){
  const d = [...DECK];
  for(let i=d.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [d[i],d[j]] = [d[j],d[i]];
  }
  return d;
}

function clearReading(){
  drawnCards = [];
  document.getElementById('cardsArea').innerHTML = '';
  document.getElementById('cardsArea').className = 'cards';
  document.getElementById('revealHint').style.display = 'none';
  document.getElementById('resetRow').style.display = 'none';
  document.getElementById('drawBtn').disabled = false;
  const synth = document.getElementById('synthesis');
  synth.classList.remove('visible');
  synth.innerHTML = '';
}

function draw(){
  const positions = SPREADS[currentSpread].positions;
  const allowRev = document.getElementById('allowReversed').checked;
  const shuffled = shuffledDeck();
  drawnCards = positions.map((label, i)=>({
    card: shuffled[i],
    reversed: allowRev ? Math.random() < 0.35 : false,
    position: label
  }));
  renderCards();
  document.getElementById('drawBtn').disabled = true;
  document.getElementById('resetRow').style.display = 'block';
  document.getElementById('revealHint').style.display = 'block';
}

function renderCards(){
  const area = document.getElementById('cardsArea');
  area.innerHTML = '';
  area.className = 'cards n' + drawnCards.length;

  drawnCards.forEach((entry, idx)=>{
    const slot = document.createElement('div');
    slot.className = 'slot';

    const posLabel = document.createElement('div');
    posLabel.className = 'position-label';
    posLabel.textContent = entry.position;
    slot.appendChild(posLabel);

    const scene = document.createElement('div');
    scene.className = 'card-scene';

    const card = document.createElement('div');
    card.className = 'card' + (entry.reversed ? ' reversed' : '');
    card.dataset.idx = idx;

    const back = document.createElement('div');
    back.className = 'face back';

    const front = document.createElement('div');
    front.className = 'face front';
    const c = entry.card;
    const numLabel = c.arcana === 'major'
      ? (c.number===0 ? '0' : toRoman(c.number))
      : c.suit.toUpperCase();
    const glyphMarkup = glyphFor(c);
    const artClass = entry.reversed ? ' reversed-art' : '';
    front.innerHTML = `
      <div class="card-image">
        <img class="${artClass.trim()}" src="${c.image}" alt="${c.name}" loading="lazy"
             onerror="this.closest('.card-image').outerHTML = '<div class=&quot;glyph${artClass}&quot;>${glyphMarkup.replace(/"/g,'&quot;')}</div>';">
      </div>
      <div class="caption">
        <div class="arcana-no">${numLabel}</div>
        <div class="card-name">${c.name}</div>
        ${c.arcana==='minor' ? `<div class="suit-tag">${c.suit}</div>` : ''}
      </div>
    `;

    card.appendChild(back);
    card.appendChild(front);
    scene.appendChild(card);
    slot.appendChild(scene);

    const meaning = document.createElement('div');
    meaning.className = 'meaning';
    meaning.style.visibility = 'hidden';
    meaning.innerHTML = `
      <div class="orientation">${entry.reversed ? 'Reversed' : 'Upright'}</div>
      <div class="keywords">${entry.reversed ? c.reversedMeaning : c.upright}</div>
    `;
    slot.appendChild(meaning);

    scene.addEventListener('click', ()=>{
      if(card.classList.contains('flipped')) return;
      card.classList.add('flipped');
      setTimeout(()=>{
        meaning.style.visibility = 'visible';
        entry.revealed = true;
        if(drawnCards.every(e=>e.revealed)) buildSynthesis();
      }, 500);
    });

    area.appendChild(slot);
  });
}

function toRoman(num){
  const romans = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
  return romans[num-1] || String(num);
}

function buildSynthesis(){
  const synth = document.getElementById('synthesis');

  const total = drawnCards.reduce((sum, e)=>{
    const v = e.reversed ? e.card.reversedValence : e.card.uprightValence;
    return sum + v;
  }, 0);
  const avg = total / drawnCards.length;

  let toneLabel, toneLine;
  if(avg >= 0.5){
    toneLabel = "Mostly favorable ground";
    toneLine = "More of the cards here are pointing toward ease, movement, or things going your way than toward friction.";
  } else if(avg >= 0.15){
    toneLabel = "Leaning favorable, with something to work through";
    toneLine = "The overall lean is toward ease, but at least one card is asking for real attention alongside it.";
  } else if(avg > -0.15){
    toneLabel = "A genuine mix";
    toneLine = "This spread isn't tilted one way. It's holding both ease and friction at once, which is often the most honest kind of reading.";
  } else if(avg > -0.5){
    toneLabel = "Leaning toward challenge";
    toneLine = "More of these cards are naming something difficult than something easy. That's not a bad omen, it's usually a nudge toward what needs attention.";
  } else {
    toneLabel = "A demanding spread";
    toneLine = "Most of what came up here is pointing at friction, endings, or work still ahead. Worth sitting with rather than rushing past.";
  }

  const notesHtml = drawnCards.map(e=>{
    const c = e.card;
    const meaning = e.reversed ? c.reversedMeaning : c.upright;
    const orient = e.reversed ? "reversed" : "upright";
    return `
      <div class="card-note">
        <div class="who">${e.position} — ${c.name} (${orient})</div>
        <div class="what">${meaning}</div>
      </div>
    `;
  }).join('');

  synth.innerHTML = `
    <h2>${toneLabel}</h2>
    <p class="tone-line">${toneLine}</p>
    ${notesHtml}
    <p class="caveat">A reversed card isn't automatically bad news and an upright one isn't automatically good news, these are prompts for reflection rather than a verdict. Read them against whatever you actually asked going in.</p>
  `;
  requestAnimationFrame(()=>synth.classList.add('visible'));
  synth.scrollIntoView({behavior:'smooth', block:'nearest'});
}

document.getElementById('drawBtn').addEventListener('click', draw);
document.getElementById('resetBtn').addEventListener('click', clearReading);
</script>
</body>
</html>
